# Runs the tests and the secret scan on every push and pull request. Both jobs
# are the suite's shared workflows in cronumstudio/.github.
name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    uses: cronumstudio/.github/.github/workflows/test.yml@main
  secrets:
    uses: cronumstudio/.github/.github/workflows/secret-scan.yml@main
